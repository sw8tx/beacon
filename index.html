<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sparkle Beacon</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #98d857;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        background:
          linear-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.07) 1px, transparent 1px),
          radial-gradient(circle at 50% 35%, rgba(196, 255, 148, 0.8), transparent 35%),
          linear-gradient(135deg, #a4df58 0%, #8fd04c 48%, #74ba48 100%);
        background-size:
          52px 52px,
          52px 52px,
          100% 100%,
          100% 100%;
      }

      #app {
        position: fixed;
        inset: 0;
      }

      #app::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(circle at 50% 56%, rgba(71, 255, 224, 0.32), transparent 22%),
          radial-gradient(circle at 48% 28%, rgba(245, 255, 255, 0.22), transparent 18%),
          linear-gradient(90deg, rgba(21, 102, 54, 0.05), transparent 18%, transparent 82%, rgba(21, 102, 54, 0.09));
        mix-blend-mode: screen;
      }

      .brand {
        position: fixed;
        top: clamp(18px, 3vw, 34px);
        right: 0;
        z-index: 3;
        display: inline-flex;
        align-items: center;
        justify-content: flex-end;
        gap: 10px;
        width: 100vw;
        max-width: 100vw;
        padding-right: clamp(18px, 4vw, 52px);
        color: #f5fff2;
        font-size: clamp(24px, 4vw, 52px);
        font-weight: 900;
        letter-spacing: 0;
        text-shadow:
          0 3px 0 rgba(33, 92, 54, 0.24),
          0 14px 35px rgba(36, 103, 61, 0.38),
          0 0 24px rgba(145, 255, 238, 0.55);
        user-select: none;
      }

      .brand::before {
        content: "";
        width: 0.44em;
        height: 0.44em;
        display: block;
        background: #eaffff;
        clip-path: polygon(50% 0, 62% 36%, 100% 50%, 62% 64%, 50% 100%, 38% 64%, 0 50%, 38% 36%);
        filter: drop-shadow(0 0 12px rgba(129, 255, 239, 0.95));
        animation: twinkle 1.7s ease-in-out infinite;
      }

      .hint {
        position: fixed;
        left: clamp(16px, 3vw, 36px);
        bottom: clamp(16px, 3vw, 30px);
        z-index: 2;
        display: inline-flex;
        align-items: center;
        min-height: 36px;
        padding: 0 14px;
        border: 1px solid rgba(245, 255, 242, 0.35);
        border-radius: 8px;
        color: rgba(255, 255, 255, 0.84);
        background: rgba(22, 82, 51, 0.2);
        backdrop-filter: blur(10px);
        font-size: 13px;
        font-weight: 650;
      }

      .loader {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #f6fff4;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0;
        text-shadow: 0 3px 18px rgba(21, 81, 48, 0.45);
        pointer-events: none;
      }

      .loader.is-hidden {
        opacity: 0;
        transition: opacity 300ms ease;
      }

      canvas {
        display: block;
      }

      @keyframes twinkle {
        0%,
        100% {
          transform: rotate(0deg) scale(0.9);
          opacity: 0.78;
        }
        50% {
          transform: rotate(45deg) scale(1.16);
          opacity: 1;
        }
      }

      @media (max-width: 1000px) {
        .brand {
          font-size: 28px;
          width: 390px;
          padding-right: 18px;
        }

        .hint {
          right: 16px;
          justify-content: center;
        }
      }

      @media (orientation: portrait) {
        .brand {
          transform: translateX(-128px);
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.166.1/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.166.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main id="app" aria-label="Interaktives 3D Sparkle Beacon"></main>
    <div class="brand">Sparkle</div>
    <div class="hint">ziehen zum Drehen</div>
    <div class="loader" id="loader">Beacon wird geladen</div>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

      const app = document.querySelector("#app");
      const loaderEl = document.querySelector("#loader");

      const scene = new THREE.Scene();
      scene.background = null;
      scene.fog = new THREE.Fog(0x98d857, 10, 24);

      const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(4.2, 3.3, 5.2);

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 0.72;
      app.appendChild(renderer.domElement);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 1.0;
      controls.enablePan = false;
      controls.minDistance = 4.2;
      controls.maxDistance = 8.5;
      controls.target.set(0, 1.1, 0);

      scene.add(new THREE.HemisphereLight(0xf6fff0, 0x3c7d48, 3.15));
      const key = new THREE.DirectionalLight(0xffffff, 2.4);
      key.position.set(4, 6, 3);
      scene.add(key);
      const rim = new THREE.DirectionalLight(0x8ffff0, 1.7);
      rim.position.set(-4, 3.2, -3);
      scene.add(rim);
      const coreLight = new THREE.PointLight(0x9ffff4, 1.25, 7, 1.6);
      coreLight.position.set(0, 1.65, 0);
      scene.add(coreLight);

      const floor = new THREE.Mesh(
        new THREE.CircleGeometry(3.15, 72),
        new THREE.MeshBasicMaterial({ color: 0x6ab34a, transparent: true, opacity: 0.18 })
      );
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = -0.02;
      scene.add(floor);

      const glow = new THREE.Mesh(
        new THREE.CircleGeometry(1.5, 72),
        new THREE.MeshBasicMaterial({
          color: 0x8ffff0,
          transparent: true,
          opacity: 0.22,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        })
      );
      glow.rotation.x = -Math.PI / 2;
      glow.position.y = 0.03;
      scene.add(glow);

      const haloMaterial = new THREE.MeshBasicMaterial({
        color: 0xbaffef,
        transparent: true,
        opacity: 0.28,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide,
        depthWrite: false
      });
      const haloGroup = new THREE.Group();
      scene.add(haloGroup);
      for (let i = 0; i < 4; i += 1) {
        const ring = new THREE.Mesh(new THREE.RingGeometry(0.72 + i * 0.18, 0.76 + i * 0.18, 4), haloMaterial.clone());
        ring.rotation.x = -Math.PI / 2;
        ring.rotation.z = Math.PI / 4;
        ring.position.y = 1.78 + i * 0.08;
        ring.material.opacity = 0.26 - i * 0.035;
        ring.userData.speed = 0.35 + i * 0.17;
        haloGroup.add(ring);
      }

      const sparkleGroup = new THREE.Group();
      scene.add(sparkleGroup);

      function makeSpark(radius, y, delay) {
        const shape = new THREE.Shape();
        shape.moveTo(0, radius);
        shape.lineTo(radius * 0.17, radius * 0.18);
        shape.lineTo(radius, 0);
        shape.lineTo(radius * 0.17, -radius * 0.18);
        shape.lineTo(0, -radius);
        shape.lineTo(-radius * 0.17, -radius * 0.18);
        shape.lineTo(-radius, 0);
        shape.lineTo(-radius * 0.17, radius * 0.18);
        shape.closePath();

        const mesh = new THREE.Mesh(
          new THREE.ShapeGeometry(shape),
          new THREE.MeshBasicMaterial({
            color: 0xf3ffff,
            transparent: true,
            opacity: 0.82,
            blending: THREE.AdditiveBlending,
            side: THREE.DoubleSide,
            depthWrite: false
          })
        );
        mesh.position.set(Math.sin(delay) * 1.05, y, Math.cos(delay) * 1.05);
        mesh.userData.delay = delay;
        sparkleGroup.add(mesh);
      }

      makeSpark(0.18, 2.2, 0.2);
      makeSpark(0.12, 2.58, 2.0);
      makeSpark(0.09, 1.95, 3.8);
      makeSpark(0.075, 2.82, 5.1);
      makeSpark(0.11, 1.72, 6.4);

      const pixelGroup = new THREE.Group();
      scene.add(pixelGroup);
      const pixelGeometry = new THREE.BoxGeometry(0.045, 0.045, 0.045);
      const pixelMaterials = [0xcffff7, 0x74ffee, 0xffffff].map(
        (color) =>
          new THREE.MeshBasicMaterial({
            color,
            transparent: true,
            opacity: 0.74,
            blending: THREE.AdditiveBlending,
            depthWrite: false
          })
      );
      for (let i = 0; i < 52; i += 1) {
        const angle = i * 2.399963;
        const radius = 0.7 + (i % 9) * 0.085;
        const pixel = new THREE.Mesh(pixelGeometry, pixelMaterials[i % pixelMaterials.length].clone());
        pixel.position.set(Math.cos(angle) * radius, 0.55 + (i % 17) * 0.095, Math.sin(angle) * radius);
        pixel.rotation.set(angle * 0.2, angle * 0.35, angle);
        pixel.userData.angle = angle;
        pixel.userData.radius = radius;
        pixel.userData.lift = i % 17;
        pixel.userData.speed = 0.25 + (i % 5) * 0.045;
        pixelGroup.add(pixel);
      }

      const beamVeils = new THREE.Group();
      scene.add(beamVeils);
      for (let i = 0; i < 5; i += 1) {
        const veil = new THREE.Mesh(
          new THREE.PlaneGeometry(0.46 + i * 0.12, 7.2),
          new THREE.MeshBasicMaterial({
            color: i % 2 ? 0xdcfff8 : 0x83fff0,
            transparent: true,
            opacity: 0.08 - i * 0.006,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            side: THREE.DoubleSide
          })
        );
        veil.position.y = 3.65;
        veil.rotation.y = (Math.PI / 5) * i;
        veil.userData.speed = 0.06 + i * 0.018;
        beamVeils.add(veil);
      }

      const modelRoot = new THREE.Group();
      modelRoot.rotation.y = Math.PI * 0.08;
      scene.add(modelRoot);

      new GLTFLoader().load(
        "assets/sparkle_beacon.glb?v=5",
        (gltf) => {
          const model = gltf.scene;
          model.traverse((child) => {
            if (child.isMesh) {
              child.castShadow = false;
              child.receiveShadow = false;
              if (child.material?.transparent) {
                child.material.depthWrite = false;
              }
              const materialName = child.material?.name?.toLowerCase() || "";
              const objectName = child.name?.toLowerCase() || "";
              if (materialName.includes("beam") || objectName.includes("beam")) {
                child.material.opacity = 0.08;
                child.material.emissiveIntensity = 0.15;
                child.renderOrder = -1;
              }
              if (materialName.includes("heart") || materialName.includes("core")) {
                child.material.emissiveIntensity = Math.min(child.material.emissiveIntensity || 1, 1.8);
              }
            }
          });
          modelRoot.add(model);
          loaderEl.classList.add("is-hidden");
        },
        undefined,
        () => {
          loaderEl.textContent = "Beacon konnte nicht geladen werden";
        }
      );

      const clock = new THREE.Clock();
      function animate() {
        const t = clock.getElapsedTime();
        modelRoot.position.y = Math.sin(t * 1.45) * 0.04;
        coreLight.intensity = 1.05 + Math.sin(t * 2.4) * 0.28;
        glow.scale.setScalar(1 + Math.sin(t * 2.2) * 0.05);
        beamVeils.children.forEach((veil, index) => {
          veil.rotation.y += veil.userData.speed * 0.01;
          veil.material.opacity = 0.045 + Math.sin(t * 1.7 + index) * 0.022;
        });
        haloGroup.children.forEach((ring, index) => {
          ring.rotation.z = Math.PI / 4 + t * ring.userData.speed;
          ring.scale.setScalar(1 + Math.sin(t * 2 + index) * 0.06);
        });
        pixelGroup.children.forEach((pixel, index) => {
          const angle = pixel.userData.angle + t * pixel.userData.speed;
          const pulse = Math.sin(t * 2.3 + index) * 0.04;
          pixel.position.x = Math.cos(angle) * (pixel.userData.radius + pulse);
          pixel.position.z = Math.sin(angle) * (pixel.userData.radius + pulse);
          pixel.position.y = 0.52 + ((pixel.userData.lift + t * 1.4) % 17) * 0.096;
          pixel.rotation.y += 0.018;
          pixel.material.opacity = 0.36 + Math.sin(t * 3.2 + index) * 0.28;
        });
        sparkleGroup.children.forEach((spark) => {
          spark.lookAt(camera.position);
          spark.rotation.z = t * 1.6 + spark.userData.delay;
          spark.material.opacity = 0.46 + Math.sin(t * 2.8 + spark.userData.delay) * 0.32;
        });
        controls.update();
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }

      function resize() {
        const aspect = window.innerWidth / window.innerHeight;
        camera.aspect = aspect;
        if (aspect < 0.68) {
          camera.fov = 52;
          camera.position.set(5.4, 4.1, 7.4);
          controls.minDistance = 5.7;
          controls.maxDistance = 10.0;
        } else {
          camera.fov = 38;
          camera.position.set(4.2, 3.3, 5.2);
          controls.minDistance = 4.2;
          controls.maxDistance = 8.5;
        }
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      window.addEventListener("resize", resize);
      resize();
      animate();
    </script>
  </body>
</html>
